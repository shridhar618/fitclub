<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitClub - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex">
        <!-- Sidebar -->
        <div class="w-64 bg-gray-800 text-white">
            <div class="p-4">
                <h1 class="text-2xl font-bold">FitClub Admin</h1>
            </div>
            <nav class="mt-6">
                <div class="px-4 space-y-2">
                    <a href="#" class="block py-2 px-4 bg-gray-700 rounded-md flex items-center" id="dashboard-tab">
                        <img src="/images/dashboard-icon.png" alt="Dashboard" class="w-5 h-5 mr-2">
                        Dashboard
                    </a>
                    <a href="#" class="block py-2 px-4 hover:bg-gray-700 rounded-md flex items-center" id="users-tab">
                        <img src="/images/users-icon.png" alt="Users" class="w-5 h-5 mr-2">
                        Users
                    </a>
                    <a href="#" class="block py-2 px-4 hover:bg-gray-700 rounded-md flex items-center" id="stats-tab">
                        <img src="/images/stats-icon.png" alt="Statistics" class="w-5 h-5 mr-2">
                        Statistics
                    </a>
                </div>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1">
            <!-- Top Navigation -->
            <header class="bg-white shadow">
                <div class="flex justify-between items-center px-6 py-4">
                    <h2 class="text-xl font-semibold" id="page-title">Dashboard</h2>
                    <div class="flex items-center">
                        <span class="mr-4" id="admin-name">Admin</span>
                        <button id="logout-btn" class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600 flex items-center">
                            <img src="/images/logout-icon.png" alt="Logout" class="w-4 h-4 mr-2">
                            Logout
                        </button>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <main class="p-6">
                <!-- Dashboard Content -->
                <div id="dashboard-content" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-lg shadow">
                            <h3 class="text-lg font-semibold mb-2">Total Users</h3>
                            <p class="text-3xl font-bold" id="total-users">0</p>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow">
                            <h3 class="text-lg font-semibold mb-2">New Users Today</h3>
                            <p class="text-3xl font-bold" id="new-users">0</p>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow">
                            <h3 class="text-lg font-semibold mb-2">Active Users</h3>
                            <p class="text-3xl font-bold" id="active-users">0</p>
                        </div>
                    </div>
                </div>

                <!-- Users Content -->
                <div id="users-content" class="hidden">
                    <div class="bg-white rounded-lg shadow overflow-hidden">
                        <div class="p-4">
                            <h3 class="text-lg font-semibold">User Management</h3>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Joined Date</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200" id="users-table-body">
                                    <!-- Users will be loaded here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Statistics Content -->
                <div id="stats-content" class="hidden">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-lg shadow">
                            <h3 class="text-lg font-semibold mb-4">User Growth</h3>
                            <canvas id="user-growth-chart"></canvas>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow">
                            <h3 class="text-lg font-semibold mb-4">Activity Distribution</h3>
                            <canvas id="activity-chart"></canvas>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
