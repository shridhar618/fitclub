<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitClub - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.4.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #e94560;
            --text-color: #ffffff;
            --error-color: #ff4444;
            --success-color: #00C851;
            --input-bg: rgba(255, 255, 255, 0.1);
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            display: flex;
            flex-direction: column;
            color: var(--text-color);
        }

        .navbar {
            padding: 1rem 2rem;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .navbar-brand {
            color: var(--text-color);
            font-size: 1.5rem;
            font-weight: 600;
            text-decoration: none;
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .signup-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .card-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .card-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 1rem;
            padding-left: 2.5rem;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.1);
        }

        .input-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            user-select: none;
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background: #d63d56;
            transform: translateY(-2px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .form-footer {
            text-align: center;
            margin-top: 2rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .form-footer a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 500;
            margin-left: 0.5rem;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .success-message {
            color: var(--success-color);
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        @media (max-width: 480px) {
            .signup-card {
                padding: 2rem;
            }

            .card-header h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="navbar-brand">FITCLUB</a>
    </nav>

    <div class="container">
        <div class="signup-card">
            <div class="card-header">
                <h1>Create Account</h1>
                <p>Join FitClub and start your fitness journey</p>
            </div>

            <form id="signupForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <div class="input-group">
                        <i class="ri-user-line"></i>
                        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                        <div class="error-message" id="nameError"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-group">
                        <i class="ri-mail-line"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        <div class="error-message" id="emailError"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <i class="ri-lock-line"></i>
                        <input type="password" id="password" name="password" placeholder="Create a password" required>
                        <span class="password-toggle" id="passwordToggle">
                            <i class="ri-eye-line"></i>
                        </span>
                        <div class="error-message" id="passwordError"></div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Sign Up</button>
                <div class="success-message" id="successMessage"></div>
            </form>

            <div class="form-footer">
                Already have an account?<a href="../login.html">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        // Password visibility toggle
        const passwordToggle = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('password');

        passwordToggle.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            passwordToggle.innerHTML = type === 'password' ? 
                '<i class="ri-eye-line"></i>' : 
                '<i class="ri-eye-off-line"></i>';
        });

        // Form validation and submission
        const signupForm = document.getElementById('signupForm');
        const nameError = document.getElementById('nameError');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const successMessage = document.getElementById('successMessage');

        function showError(element, message) {
            element.textContent = message;
            element.style.display = 'block';
        }

        function hideError(element) {
            element.style.display = 'none';
        }

        function validatePassword(password) {
            const minLength = 8;
            const hasUpperCase = /[A-Z]/.test(password);
            const hasLowerCase = /[a-z]/.test(password);
            const hasNumbers = /\d/.test(password);
            const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);

            if (password.length < minLength) {
                return 'Password must be at least 8 characters long';
            }
            if (!hasUpperCase || !hasLowerCase) {
                return 'Password must contain both uppercase and lowercase letters';
            }
            if (!hasNumbers) {
                return 'Password must contain at least one number';
            }
            if (!hasSpecialChar) {
                return 'Password must contain at least one special character';
            }
            return '';
        }

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reset errors
            hideError(nameError);
            hideError(emailError);
            hideError(passwordError);
            hideError(successMessage);

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Validation
            let hasError = false;

            if (name.length < 2) {
                showError(nameError, 'Name must be at least 2 characters long');
                hasError = true;
            }

            if (!email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
                showError(emailError, 'Please enter a valid email address');
                hasError = true;
            }

            const passwordValidationError = validatePassword(password);
            if (passwordValidationError) {
                showError(passwordError, passwordValidationError);
                hasError = true;
            }

            if (hasError) return;

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    successMessage.textContent = 'Registration successful! Redirecting to login...';
                    successMessage.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 2000);
                } else {
                    showError(emailError, data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                showError(emailError, 'An error occurred during registration');
            }
        });

        // Clear errors on input
        document.getElementById('name').addEventListener('input', () => hideError(nameError));
        document.getElementById('email').addEventListener('input', () => hideError(emailError));
        document.getElementById('password').addEventListener('input', () => hideError(passwordError));
    </script>
</body>
</html>
